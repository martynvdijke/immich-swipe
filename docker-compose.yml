# Docker Compose

services:
  immich-swipe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immich-swipe
    restart: unless-stopped
    ports:
      - "2293:8080"
    environment:
      # Runtime configuration (no rebuild needed for changes)
      - LISTEN_ADDR=:8080
      - IMMICH_SERVER_URL=${IMMICH_SERVER_URL:-}
      - IMMICH_API_KEY_1_NAME=${IMMICH_API_KEY_1_NAME:-}
      - IMMICH_API_KEY_1_KEY=${IMMICH_API_KEY_1_KEY:-}
      - IMMICH_API_KEY_2_NAME=${IMMICH_API_KEY_2_NAME:-}
      - IMMICH_API_KEY_2_KEY=${IMMICH_API_KEY_2_KEY:-}
      - IMMICH_API_KEY_3_NAME=${IMMICH_API_KEY_3_NAME:-}
      - IMMICH_API_KEY_3_KEY=${IMMICH_API_KEY_3_KEY:-}
      - IMMICH_API_KEY_4_NAME=${IMMICH_API_KEY_4_NAME:-}
      - IMMICH_API_KEY_4_KEY=${IMMICH_API_KEY_4_KEY:-}
      - IMMICH_API_KEY_5_NAME=${IMMICH_API_KEY_5_NAME:-}
      - IMMICH_API_KEY_5_KEY=${IMMICH_API_KEY_5_KEY:-}
      # Trmnl e-ink stats persistence (optional). Set TRMNL_STATS_FILE to a
      # path on a mounted volume to survive container restarts, e.g.:
      #   volumes: [ "./data:/data" ]
      #   TRMNL_STATS_FILE=/data/trmnl-stats.json
      - TRMNL_STATS_FILE=${TRMNL_STATS_FILE:-}
      # Session persistence (optional). Set IMMICH_SESSIONS_DB to a path on a
      # mounted volume so logged-in users survive container restarts, e.g.:
      #   volumes: [ "./data:/data" ]
      #   IMMICH_SESSIONS_DB=/data/immich-swipe.db
      # WARNING: the database contains Immich credentials (API keys / access
      # tokens) in plain text — protect the volume accordingly.
      - IMMICH_SESSIONS_DB=${IMMICH_SESSIONS_DB:-}
      # OpenTelemetry (OTLP) — leave unset to run without observability
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_PROTOCOL=${OTEL_EXPORTER_OTLP_PROTOCOL:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-}
